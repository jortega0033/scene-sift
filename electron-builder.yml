appId: com.scenesift.app
productName: SceneSift
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - dist-electron/**
  - src/database/migrations/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
extraMetadata:
  main: dist-electron/main/index.js
mac:
  target:
    - dmg
    - zip
  category: public.app-category.video
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
