name: agent-evidence

on:
  pull_request:

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Ensure AI disclosure and evidence sections exist
        run: |
          test -f .github/pull_request_template.md
          grep -q "AI Assistance Disclosure" .github/pull_request_template.md
          grep -q "Required Evidence" .github/pull_request_template.md
          grep -q "Human Approval" .github/pull_request_template.md
