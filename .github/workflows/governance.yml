name: governance

on:
  pull_request:
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm governance:validate
      - run: pnpm governance:scenarios
      - run: pnpm architecture:validate
      - run: pnpm design:validate
      - run: pnpm dependencies:validate
      - name: Enforce governance-change approval marker for protected paths
        if: github.event_name == 'pull_request'
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED="$(git diff --name-only "$BASE_REF"...HEAD || true)"
          PROTECTED_PATTERN='^(gate.yaml|loop-constraints.md|loop-budget.md|\.github/copilot-instructions\.md|\.github/instructions/|\.github/agents/|\.github/workflows/|scripts/governance/|scripts/quality/|package\.json|pnpm-lock\.yaml)'
          if echo "$CHANGED" | grep -E "$PROTECTED_PATTERN" >/dev/null 2>&1; then
            BODY='${{ github.event.pull_request.body }}'
            if ! echo "$BODY" | grep -q "Governance Change Approval: yes"; then
              echo "Protected governance/quality paths changed without explicit PR approval marker."
              echo "Add 'Governance Change Approval: yes' to PR body after human review."
              exit 1
            fi
          fi
